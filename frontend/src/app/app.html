<div id="app-header">Basketball Lineup Analyzer</div>
<nav mat-tab-nav-bar [tabPanel]="tabPanel">
  <a
    mat-tab-link
    routerLink="/lineups-summary"
    routerLinkActive
    [active]="currentTab === tab.FRONTEND"
    (click)="currentTab = tab.FRONTEND"
  >
    Dashboard
  </a>
  <a
    mat-tab-link
    routerLink="/lineups-summary-api"
    routerLinkActive
    [active]="currentTab === tab.BACKEND"
    (click)="currentTab = tab.BACKEND"
  >
    API Explorer
  </a>
</nav>
<mat-tab-nav-panel #tabPanel>
  <router-outlet></router-outlet>
</mat-tab-nav-panel>
